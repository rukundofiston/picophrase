plugins {
    id 'com.android.application'
}

android {
    namespace "com.symbolicone.ouille"
    compileSdkVersion 34
    buildToolsVersion "36.1.0"

    defaultConfig {
        applicationId 'com.symbolicone.ouille'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 18
        versionName "1.5.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ["-Xmaxerrs", "2000"]
    }

    lintOptions {
        abortOnError false
    }

    buildFeatures {
        buildConfig = false
    }

    aaptOptions {
        noCompress 'mp3', 'sbin', 'atlas', 'json'
    }

    sourceSets {
        main {
            java {
                exclude 'b/c/**'
                exclude 'c/**'
                exclude 'org/cocos2dx/lib/a.java'
                exclude 'org/cocos2dx/lib/b.java'
                exclude 'org/cocos2dx/lib/c.java'
                exclude 'org/cocos2dx/lib/d.java'
            }
        }
    }
}

dependencies {
    implementation 'com.loopj.android:android-async-http:1.4.9'
}
